<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>登入中...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1923;
      color: #ece8e1;
      font-family: 'Tungsten', 'Arial Narrow', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .box { text-align: center; }
    .title { font-size: 2rem; letter-spacing: 0.15em; margin-bottom: 0.5rem; }
    .sub { color: #9e9e9e; font-size: 1rem; margin-bottom: 1.5rem; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #ffffff22;
      border-top-color: #ff4655;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #ff4655; font-size: 1.1rem; margin-bottom: 1rem; }
    .back { color: #9e9e9e; text-decoration: none; font-size: 0.9rem; }
    .back:hover { color: #ff4655; }
  </style>
</head>
<body>
<div class="box" id="box">
  <div class="spinner"></div>
  <div class="title">VAL TRACKER</div>
  <div class="sub">正在完成登入...</div>
</div>
<script>
(async function () {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const accessToken = params.get('access_token');

  if (!accessToken) {
    const error = params.get('error_description') || params.get('error') || '未收到 token';
    document.getElementById('box').innerHTML =
      `<div class="err">登入失敗：${error}</div><a class="back" href="/">返回</a>`;
    return;
  }

  try {
    const r = await fetch('/api/auth/from-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessToken }),
    });
    const data = await r.json();
    if (data.success) {
      window.location.replace('/');
    } else {
      document.getElementById('box').innerHTML =
        `<div class="err">登入失敗：${data.error}</div><a class="back" href="/">返回</a>`;
    }
  } catch {
    document.getElementById('box').innerHTML =
      `<div class="err">網路錯誤，請重試</div><a class="back" href="/">返回</a>`;
  }
})();
</script>
</body>
</html>
